[project]
name = "jev-recorder"
version = "0.0.1"
description = "Auto-import, segment, transcribe and timeline USB voice recordings, offline"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
spike = [
  "torch>=2.13", "torchaudio", "transformers>=4.57", "accelerate",
  "soundfile", "numpy", "jiwer", "mutagen", "silero-vad", "huggingface_hub",
  "qwen-asr", "pandas", "tqdm", "librosa", "opencc-python-reimplemented",
]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
